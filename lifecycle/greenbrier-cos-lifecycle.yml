method: searched
source: >-
  Searched gbrx.com and every Greenbrier product host for a status page, changelog, versioning
  policy, deprecation policy and SLA on 2026-09-12; derived the versioning facts from the live
  contracts.
note: >-
  This is an honest set of absences. Greenbrier operates real public APIs without any of the
  operational scaffolding an API program normally carries, because it does not consider them an API
  program. A consumer of the gauge-table API in particular is depending on an unversioned,
  unannounced, unmonitored endpoint.
