  - name: list_reporting_marks
    description: List every railcar reporting mark for which Greenbrier holds a certified gauge table.
    rest: listReportingMarks
    api: Greenbrier Tank Car Gauge Table API
    read_only: true
  - name: get_gauge_table
    description: >-
      Get the certified gauge table for one tank car - tare weight, shell full capacity,
      certification date and the innage/outage capacity curve.
    rest: getGaugeTable
    api: Greenbrier Tank Car Gauge Table API
    read_only: true
    caution: Answers HTTP 200 with a null body when the car is not held; test the body, not the status.
  - name: list_gauge_tables
    description: Get gauge tables for a contiguous car-number range under one reporting mark.
    rest: listGaugeTables
    api: Greenbrier Tank Car Gauge Table API
