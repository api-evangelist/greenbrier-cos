  - aid: greenbrier-cos:greenbrier-cos-railcar-catalog-api
    name: Greenbrier Railcar Catalog API
    description: >-
      Public, unauthenticated read access to the Greenbrier railcar product catalog — the `railcars`
      custom post type behind www.gbrx.com and its four purpose-built taxonomies (railcar type,
      cargo type, fluid capacity, cargo capacity). Verified live on 2026-09-12 at 85 published
      railcars, 18 railcar types and 66 cargo types. This is the product catalog of a railcar
      manufacturer, addressable by HTTP with no credentials.
