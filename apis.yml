aid: greenbrier-cos
name: Greenbrier Companies
description: >-
  The Greenbrier Companies is a leading international supplier of equipment and services to global
  freight transportation markets, designing, building and marketing freight railcars in North
  America, Europe and South America from its headquarters in Lake Oswego, Oregon. Greenbrier also
  operates railcar leasing and fleet management, wheel services, maintenance and repair, marine
  barge manufacturing in Portland, and participates in the RailPulse railcar-telematics joint
  venture. Greenbrier publishes no developer program, no API portal and no SDKs, and sells no API
  product. It does, however, operate several real, anonymously callable HTTP surfaces on its own
  hosts: a bespoke JSON API serving certified tank-car gauge tables at tankcar.gbrx.com, and the
  WordPress and WooCommerce Store REST APIs behind www.gbrx.com, which expose the railcar product
  catalog, the aftermarket parts catalog, the press room and site search. Those are catalogued here
  for discovery; they are not a product Greenbrier markets.
