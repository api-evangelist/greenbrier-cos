apis:
  - aid: greenbrier-cos:greenbrier-cos-gauge-table-api
    name: Greenbrier Tank Car Gauge Table API
    description: >-
      Public, unauthenticated JSON API behind the Greenbrier Gauge Table Directory. Given a railcar
      reporting mark and car number it returns the car's certified gauge table — tare weight, shell
      full capacity, certification date and the full innage/outage capacity curve in quarter-inch
      increments — plus Pdf/Csv/Txt exports in gallons or liters. Verified live on 2026-09-12 at 144
      reporting marks and 20,049 car numbers under the GBRX mark alone. This is the only bespoke,
      first-party, publicly callable API Greenbrier operates.
    humanURL: https://tankcar.gbrx.com/
    baseURL: https://tankcar.gbrx.com
    tags:
