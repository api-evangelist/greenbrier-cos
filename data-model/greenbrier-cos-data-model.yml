source: >-
  openapi/greenbrier-cos-*-openapi.yml (components.schemas + the id-reference fields observed in
  live responses on 2026-09-12)
note: >-
  Two disjoint data cores sit under the Greenbrier estate. The www.gbrx.com core is a WordPress
  content graph whose Greenbrier-specific shape is the `railcars` entity and its four purpose-built
  taxonomies - that is the entity graph of a railcar manufacturer's product catalog. The
  tankcar.gbrx.com core is a flat, two-level engineering record with no relationships to anything
  else Greenbrier serves. Nothing joins them: a railcar in the catalog carries no reporting mark,
  and a gauge table carries no product reference.
entities:
