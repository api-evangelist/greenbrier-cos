    identifier: id (integer), slug (string)
    count_observed: 85
    description: A Greenbrier railcar model - covered hopper, tank car, gondola, boxcar, flatcar, intermodal or auto carrier.
    key_fields: [id, slug, title, content, excerpt, featured_media, menu_order, acf, link, status, date, modified]
