relationships:
  - from: Railcar
    to: RailcarType
    type: has_many
    via: railcar_type (array of term IDs)
  - from: Railcar
    to: CargoType
    type: has_many
    via: cargo_type (array of term IDs)
  - from: Railcar
    to: FluidCapacity
    type: has_many
    via: fluid_capacity (array of term IDs)
  - from: Railcar
    to: CargoCapacity
    type: has_many
    via: cargo_capacity (array of term IDs)
  - from: Railcar
    to: Media
    type: has_one
    via: featured_media (attachment ID)
  - from: StoreProduct
    to: StoreProductCategory
    type: has_many
    via: categories[] (embedded {id, name, slug, link})
  - from: StoreProduct
    to: StoreProductAttribute
    type: has_many
    via: attributes[] (embedded attribute + terms)
  - from: StoreProduct
    to: StoreProduct
    type: has_many
    via: variations[] (child variation IDs); children point back through `parent`
  - from: StoreProductCategory
    to: StoreProductCategory
    type: belongs_to
    via: parent (category ID, 0 at the root)
  - from: Post
    to: Category
    type: has_many
    via: categories (array of term IDs)
  - from: Post
    to: Tag
    type: has_many
    via: tags (array of term IDs)
  - from: Post
    to: Media
    type: has_one
    via: featured_media (attachment ID)
  - from: Page
    to: Page
    type: belongs_to
    via: parent (page ID, 0 at the root)
  - from: SearchResult
    to: Post
    type: has_one
    via: id + subtype (post | page | railcars)
  - from: GaugeTable
    to: Capacity
    type: has_many
    via: capacities[] (embedded, not referenced)
  - from: CarNumber
    to: GaugeTable
    type: has_one
    via: number, resolved through /api/car/{mark}/{number}/gauge-table
disconnects:
  - detail: >-
      There is no join between the railcar catalog and the gauge-table service. A Railcar record
      carries no reporting mark and no car number; a GaugeTable carries no product or model
      reference. A client that wants "the gauge table for this Greenbrier tank car model" cannot get
      there from either API.
  - detail: >-
      The aftermarket parts catalog carries no reference to the railcar models a part fits. Fitment
      lives only in the human-readable product description and the attribute vocabularies.
id_conventions:
  - surface: WordPress / WooCommerce REST
    detail: Opaque incrementing integers, site-scoped. Slugs are stable, human-readable secondary keys.
  - surface: Greenbrier Tank Car Gauge Table API
    detail: >-
      The natural key is the AAR reporting mark plus the car number - an industry identifier, not a
      Greenbrier one. `carNumber` on the response is the two joined with a space ("GBRX 700000")
      while the request takes them as separate path segments.
